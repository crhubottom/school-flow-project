<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>School Flow — Home</title>
  <meta name="description" content="School Flow Home" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./assets/css/home.css" />
</head>
<body>
  <div class="sidebar">
    <div class="brand" aria-label="School Flow">
      <div class="logo" aria-hidden="true">SF</div>
      <h1>School Flow</h1>
    </div>
    <section id="duesPanel" class="dues-panel" aria-label="Upcoming dues">
      <div class="dues-header">
        <h2>Your upcoming dues</h2>
        <span id="duesStatusText" class="muted" role="status" aria-live="polite"></span>
      </div>
      <div id="duesContent" class="dues-content">
        <div class="empty">No dues to show.</div>
      </div>
    </section>
  </div>
  <!--join box -->
  <div class="join-overlay" aria-label="Join group panel">
    <section class="join-group" aria-label="Join an existing group">
      <h2>Join a Group</h2>
      <div class="field">
        <label for="groupCodeInput">Group Code</label>
        <input id="groupCodeInput" name="groupCode" type="text" placeholder="e.g. ABC123" autocomplete="off" aria-describedby="joinHelp" />
        <div id="joinHelp" class="muted" style="font-size:0.7rem;">Enter the group code provided by an organizer.</div>
      </div>
      <button id="joinGroupBtn" class="join" type="button" disabled>Join Group</button>
      <div id="joinStatus" class="join-status" role="status"></div>
    </section>
  </div>
  <div class="user-menu" id="userMenu" hidden aria-label="User actions">
    <button id="createGroupBtn" class="create-group-btn" type="button" aria-label="Create a new group">Create Group</button>
    <button id="myGroupsBtn" class="create-group-btn" type="button" aria-label="My groups">My Groups</button>
    <button id="avatarBtn" class="avatar-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
      <img id="avatarImg" class="avatar-img" alt="User avatar" src="" loading="lazy" decoding="async" />
    </button>
    <div id="dropdown" class="dropdown" role="menu" aria-label="User menu">
      <header>Account</header>
      <div class="info">
        <strong id="ddName">User</strong>
        <span id="ddEmail" class="muted" style="font-size:0.75rem;"></span>
      </div>
      <button id="logoutBtn" class="menu-item" role="menuitem" type="button">Sign out</button>
    </div>
  </div>
  <div id="createGroupModal" class="modal-overlay" aria-modal="true" role="dialog" aria-labelledby="createGroupTitle" aria-hidden="true">
    <div class="modal">
      <h2 id="createGroupTitle">Create Group</h2>
      <p class="muted" style="margin:0;">Set up a new group. You'll be the admin. Share the generated code so others can join.</p>
      <div class="field">
        <label for="groupNameInput">Group Name</label>
        <input id="groupNameInput" type="text" placeholder="e.g. Cloud Computing Class" maxlength="60" />
      </div>
      <div id="createStatus" class="create-status" role="status"></div>
      <div id="createdCodeWrap" style="display:none; flex-direction:column; gap:8px;">
        <label style="font-size:0.65rem; letter-spacing:0.5px; text-transform:uppercase; color:#666;">Join Code</label>
        <div class="code-box"><span id="createdCode">------</span></div>
      </div>
      <div class="modal-actions">
        <button id="confirmCreateGroupBtn" type="button">Create</button>
        <button id="closeCreateModalBtn" class="secondary" type="button">Close</button>
      </div>
    </div>
  </div>
  <noscript>This page requires JavaScript.</noscript>
  <script type="module" src="./assets/js/app.js"></script>
  <script>
    const duesPanel = document.getElementById('duesPanel');
    const duesContent = document.getElementById('duesContent');
    const duesStatusText = document.getElementById('duesStatusText');
    const avatarBtn = document.getElementById('avatarBtn');
    const dropdown = document.getElementById('dropdown');
    const logoutBtn = document.getElementById('logoutBtn');
    const createGroupBtn = document.getElementById('createGroupBtn');
    const myGroupsBtn = document.getElementById('myGroupsBtn');
    const groupCodeInput = document.getElementById('groupCodeInput');
    const joinGroupBtn = document.getElementById('joinGroupBtn');
    const joinStatus = document.getElementById('joinStatus');

    const createGroupModal = document.getElementById('createGroupModal');
    const confirmCreateGroupBtn = document.getElementById('confirmCreateGroupBtn');
    const closeCreateModalBtn = document.getElementById('closeCreateModalBtn');
    const groupNameInput = document.getElementById('groupNameInput');
    const createStatus = document.getElementById('createStatus');
    const createdCodeWrap = document.getElementById('createdCodeWrap');
    const createdCodeSpan = document.getElementById('createdCode');

    function setJoinStatus(msg, isError=false){ if(!joinStatus) return; joinStatus.textContent = msg || ''; joinStatus.style.color = isError ? 'var(--danger)' : 'var(--muted)'; }
    function setCreateStatus(msg, isError=false){ if(!createStatus) return; createStatus.textContent = msg || ''; createStatus.style.color = isError ? 'var(--danger)' : 'var(--muted)'; }

    function toggleMenu() { dropdown.classList.contains('open') ? dropdown.classList.remove('open') : dropdown.classList.add('open'); }
    avatarBtn?.addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
    logoutBtn?.addEventListener('click', async () => { logoutBtn.disabled = true; try { await window.doSignOut(); location.replace('index.html'); } catch (e) { console.error(e); } finally { logoutBtn.disabled = false; } });

    //render dues
    function renderDues(items) {
      if (!duesContent) return;
      if (!items || items.length === 0) {
        duesContent.innerHTML = '<div class="empty">No dues to show.</div>';
        return;
      }
      const frag = document.createDocumentFragment();
      items.forEach(i => {
        const row = document.createElement('div'); row.className = 'due';
        const left = document.createElement('div'); left.className = 'due-left';
        const title = document.createElement('div'); title.className = 'due-group'; title.textContent = i.groupName || i.groupId;
        const desc = document.createElement('div'); desc.className = 'muted due-desc'; desc.textContent = i.fee.description || 'Fee';
        left.appendChild(title); left.appendChild(desc);
        const right = document.createElement('div'); right.className = 'due-right';
        const amountVal = Number(i.fee.amount || 0);
        const amt = document.createElement('div'); amt.className = 'due-amount'; amt.textContent = `${i.fee.currency || 'USD'} ${amountVal.toFixed(2)}`;
        const due = document.createElement('div'); due.className = 'muted due-date'; due.textContent = i.fee.dueDate ? new Date(i.fee.dueDate).toLocaleDateString() : 'Due anytime';
        const completeBtn = document.createElement('button'); completeBtn.className = 'due-check'; completeBtn.type = 'button'; completeBtn.setAttribute('aria-label', 'Mark as paid'); completeBtn.textContent = '✓';
        completeBtn.addEventListener('click', ev => {
          ev.stopPropagation();
          markDueAsPaid(i, completeBtn);
        });
        right.appendChild(amt); right.appendChild(due); right.appendChild(completeBtn);
        row.appendChild(left); row.appendChild(right);
        row.addEventListener('click', () => { window.location.href = `group.html?code=${encodeURIComponent(i.groupId)}`; });
        frag.appendChild(row);
      });
      duesContent.innerHTML = '';
      duesContent.appendChild(frag);
    }
    //mark due as paid button
    async function markDueAsPaid(item, button) {
      if (!window.firestoreHelpers || typeof window.firestoreHelpers.setFeeStatus !== 'function') return;
      if (!window.currentUser) return;
      const original = button.textContent;
      button.disabled = true;
      button.textContent = '…';
      try {
        await window.firestoreHelpers.setFeeStatus(item.groupId, item.feeId, 'paid');
        button.classList.add('due-check--done');
        button.textContent = '✓';
        setTimeout(() => loadDues(), 250);
      } catch (err) {
        console.error('markDueAsPaid failed', err);
        button.disabled = false;
        button.textContent = original;
        alert(err?.message || 'Failed to update fee');
      }
    }
  //set dues status text
    function setDuesStatus(text) {
      if (duesStatusText) duesStatusText.textContent = text || '';
    }
  //load dues function
    async function loadDues() {
      if (!window.firestoreHelpers || typeof window.firestoreHelpers.listUpcomingFeesForUser !== 'function') return;
      if (!window.currentUser) {
        setDuesStatus('');
        if (duesContent) duesContent.innerHTML = '<div class="muted">Sign in to see dues.</div>';
        return;
      }
      setDuesStatus('Loading…');
      if (duesContent) duesContent.innerHTML = '<div class="muted">Loading dues…</div>';
      try {
        const res = await window.firestoreHelpers.listUpcomingFeesForUser();
        const items = res?.items || [];
        const errors = res?.errors || [];
        renderDues(items);
        setDuesStatus(items.length ? `${items.length} due${items.length === 1 ? '' : 's'} pending` : 'All caught up');
        if (errors.length > 0 && duesContent) {
          const note = document.createElement('div'); note.className = 'muted'; note.style.fontSize='0.8rem';
          note.textContent = `Some groups could not be read (${errors.length}).`;
          duesContent.appendChild(note);
        }
      } catch (e) {
        console.error('loadDues error', e);
        if (duesContent) duesContent.innerHTML = '<div class="empty">Unable to load dues.</div>';
        setDuesStatus('Check your connection');
      }
    }

    //wait for auth ready
    const readyInterval = setInterval(() => {
      if (window.firestoreHelpers && window.authReady === true) {
        clearInterval(readyInterval);
        if (window.currentUser) {
          document.getElementById('userMenu').hidden = false;
          loadDues();
        } else if (duesContent) {
          duesContent.innerHTML = '<div class="muted">Sign in to see dues.</div>';
          setDuesStatus('');
        }
      }
    }, 200);

    // Join/create handlers
    groupCodeInput?.addEventListener('input', () => { const v = groupCodeInput.value.trim(); joinGroupBtn.disabled = v.length === 0; setJoinStatus(''); });
    joinGroupBtn?.addEventListener('click', async () => {
      const code = groupCodeInput.value.trim(); if (!code) return; joinGroupBtn.disabled = true; setJoinStatus('Attempting to join group…');
      try { await window.firestoreHelpers.joinGroup(code); setJoinStatus(`Joined group ${code}!`, false); window.location.href = `group.html?code=${encodeURIComponent(code)}`; }
      catch (e) { console.error(e); setJoinStatus(e?.message || 'Failed to join group.', true); }
      finally { joinGroupBtn.disabled = false; }
    });

    function openCreateModal(){ createGroupModal.style.display='grid'; createGroupModal.setAttribute('aria-hidden','false'); groupNameInput.value=''; createdCodeWrap.style.display='none'; createdCodeSpan.textContent='------'; setCreateStatus(''); confirmCreateGroupBtn.disabled=false; setTimeout(()=> { try{ groupNameInput.focus(); }catch(e){} }, 60); }
    function closeCreateModal(){ createGroupModal.style.display='none'; createGroupModal.setAttribute('aria-hidden','true'); }
    if (createGroupBtn) createGroupBtn.addEventListener('click', openCreateModal);
    closeCreateModalBtn?.addEventListener('click', () => closeCreateModal());

    confirmCreateGroupBtn?.addEventListener('click', async () => {
      if (!window.currentUser) { setCreateStatus('Not signed in.', true); return; }
      const prev = createGroupModal.style.display; createGroupModal.style.display='none'; setCreateStatus('Creating...');
      try { const res = await window.firestoreHelpers.createGroup(groupNameInput.value.trim()); window.location.replace(`group.html?code=${encodeURIComponent(res.code)}`); }
      catch (e) { createGroupModal.style.display = prev || 'grid'; setCreateStatus(e?.message || 'Failed to create group.', true); }
      finally { confirmCreateGroupBtn.disabled = false; }
    });

    myGroupsBtn?.addEventListener('click', () => { window.location.href = 'my-groups.html'; });
  </script>
</body>
</html>
